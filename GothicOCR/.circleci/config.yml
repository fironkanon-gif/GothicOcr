# ============================================================
# GOTHIC OCR — CIRCLECI CONFIGURATION
# ============================================================

version: 2.1

jobs:

  build_android:

    machine:
      image: android:current

    resource_class: large.gen2

    working_directory: ~/project

    steps:

      - checkout

      - run:
          name: Check Android build environment
          command: |
            set -e

            echo "=========================================="
            echo "GOTHIC OCR — ANDROID BUILD ENVIRONMENT"
            echo "=========================================="

            java -version
            python3 --version

            echo
            echo "ANDROID SDK:"
            echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not-set}}"

            echo
            echo "=========================================="

      - run:
          name: Install Buildozer dependencies
          command: |
            set -e

            sudo apt-get update

            sudo apt-get install -y \
              python3-pip \
              python3-venv \
              git \
              zip \
              unzip \
              autoconf \
              automake \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              gettext

      - run:
          name: Create Python build environment
          command: |
            set -e

            python3 -m venv ~/buildozer-venv

            ~/buildozer-venv/bin/python \
              -m pip install --upgrade pip setuptools wheel

            ~/buildozer-venv/bin/pip \
              install buildozer

      - run:
          name: Validate GothicOCR project
          command: |
            set -e

            cd GothicOCR

            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            echo "Project structure OK."

      - run:
          name: Validate Buildozer configuration
          command: |
            set -e

            cd GothicOCR

            ~/buildozer-venv/bin/buildozer --version

            echo
            echo "Buildozer configuration:"

            grep -E \
              '^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.archs|android.ndk|p4a.bootstrap)' \
              buildozer.spec

      - run:
          name: Build GothicOCR APK
          command: |
            set -e

            cd GothicOCR

            ~/buildozer-venv/bin/buildozer android debug

      - store_artifacts:
          path: GothicOCR/bin
          destination: gothicocr-apk

      - store_artifacts:
          path: GothicOCR/.buildozer
          destination: buildozer-build-data

workflows:

  build_android_manual:

    jobs:

      - approve_build:
          type: approval

      - build_android:
          requires:
            - approve_build
