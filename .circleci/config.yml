version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE (توسيع الكاش ليحفظ مراحل التجميع)
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-p4a-v7-{{ checksum "buildozer.spec" }}
            - gothicocr-p4a-v7-
            - gothicocr-v6-


      # ============================================================
      # 3. PREPARE SYSTEM
      # ============================================================
      - run:
          name: Prepare Build Environment
          command: |
            set -eux

            echo "Updating APT..."
            sudo apt-get update -qq

            echo "Installing build dependencies..."
            sudo apt-get install -y \
              ant \
              python3-pip \
              python3-dev \
              python3-venv \
              build-essential \
              gcc \
              g++ \
              make \
              git \
              zip \
              unzip \
              wget \
              curl \
              patch \
              pkg-config \
              cmake \
              autoconf \
              automake \
              autopoint \
              libtool \
              libffi-dev \
              libssl-dev \
              gettext \
              ccache


      # ============================================================
      # 4. VERIFY ANDROID ENVIRONMENT
      # ============================================================
      - run:
          name: Verify Android Environment
          command: |
            set -eux
            test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
            test -n "$ANDROID_SDK_ROOT" && test -d "$ANDROID_SDK_ROOT"


      # ============================================================
      # 5. INSTALL BUILDOZER + CYTHON
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux
            sudo python3 -m pip install \
              --break-system-packages \
              --ignore-installed \
              --upgrade \
              pip setuptools wheel

            sudo python3 -m pip install \
              --break-system-packages \
              buildozer==1.6.0 cython


      # ============================================================
      # 6. CONFIGURE CCACHE
      # ============================================================
      - run:
          name: Configure CCache
          command: |
            set -eux
            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 7. VERIFY PROJECT FILES
      # ============================================================
      - run:
          name: Verify GothicOCR Project
          command: |
            set -eux
            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite


      # ============================================================
      # 8. BUILD APK WITH AUTO RETRY LOOP
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1

            echo "========================================"
            echo "GOTHICOCR APK BUILD"
            echo "========================================"

            # تجهيز المجلدات مسبقاً وتخزين الملف التحميلي البديل
            mkdir -p ~/.buildozer/cache/packages/freetype
            curl -L "https://github.com/libexif/virtual-packaging/raw/master/freetype-2.14.1.tar.gz" -o ~/.buildozer/cache/packages/freetype/freetype-2.14.1.tar.gz || true

            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "Attempt $COUNT of $MAX_RETRIES..."

              if buildozer -v android debug; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed due to network issue. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi


      # ============================================================
      # 9. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK created successfully: $APK"


      # ============================================================
      # 10. SAVE BUILD CACHE (حفظ مجلد p4a ومخرجات التجميع كاملاً)
      # ============================================================
      - save_cache:
          key: gothicocr-p4a-v7-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 11. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build:
    jobs:
      - build-apk
