version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-global-cache-v1
            - gothicocr-buildozer-v8-{{ checksum "buildozer.spec" }}
            - gothicocr-p4a-v7-
            - gothicocr-v6-


      # ============================================================
      # 3. PREPARE SYSTEM & INSTALL TOOLS
      # ============================================================
      - run:
          name: Prepare Environment & Install Buildozer
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 4. PATCH FREETYPE RECIPE & PRE-DOWNLOAD (الإصلاح الجذري)
      # ============================================================
      - run:
          name: Patch FreeType Recipe & Pre-download
          command: |
            set +e
            echo "Patching python-for-android FreeType recipe..."

            # 1. تنزيل الحزمة مسبقاً وتجهيزها في الكاش الرئيسي
            CACHE_DIR="$HOME/.buildozer/cache/packages/freetype"
            mkdir -p "$CACHE_DIR"
            SF_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
            curl -L "$SF_URL" -o "$CACHE_DIR/freetype-2.14.1.tar.gz" || true

            # 2. تعديل رابط التنزيل داخل كافة ملفات recipe.py الخاصة بـ freetype في النظام
            P4A_RECIPE_PATH=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null)/recipes/freetype/__init__.py
            
            if [ -f "$P4A_RECIPE_PATH" ]; then
              echo "Patching $P4A_RECIPE_PATH..."
              sudo sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' "$P4A_RECIPE_PATH"
            fi


      # ============================================================
      # 5. BUILD APK WITH RETRY LOOP
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            set +e

            # تطبيق Patch مرة أخرى داخل المجلدات الديناميكية التي ينشئها buildozer أحياناً
            find ~/.buildozer -name "__init__.py" | grep "recipes/freetype" | xargs -r sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' 2>/dev/null || true

            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "----------------------------------------"
              echo "Attempt $COUNT of $MAX_RETRIES..."
              echo "----------------------------------------"

              buildozer -v android debug
              STATUS=$?

              if [ $STATUS -eq 0 ]; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi


      # ============================================================
      # 6. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK created successfully: $APK"


      # ============================================================
      # 7. SAVE GLOBAL BUILD CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-global-cache-v1
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 8. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


# ============================================================
# WORKFLOWS
# ============================================================
workflows:
  build-workflow:
    jobs:
      - build-apk
