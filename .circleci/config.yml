version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - checkout


      # ============================================================
      # 2. PURGE OLD CACHES
      # ============================================================
      - run:
          name: Purge Old Caches & Local Recipes
          command: |
            set +e
            rm -rf ~/.buildozer
            rm -rf ~/project/.buildozer
            rm -rf ~/project/p4a_recipes
            rm -rf ~/.cache/pip
            rm -rf ~/.cache/ccache


      # ============================================================
      # 3. PREPARE ENVIRONMENT & INSTALL BUILD TOOLS
      # ============================================================
      - run:
          name: Prepare Environment & Install Buildozer
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 4. PATCH OFFICIAL FREETYPE RECIPE URL DIRECTLY
      # ============================================================
      - run:
          name: Patch Official P4A FreeType Recipe URL
          command: |
            set +e
            echo "Patching FreeType Recipe URL inside pythonforandroid..."

            P4A_DIR=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null)
            OLD_URL="https://download.savannah.gnu.org/releases/freetype/"
            NEW_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/"

            if [ -d "$P4A_DIR" ]; then
              sudo find "$P4A_DIR" -type f -name "*.py" -exec sed -i "s|$OLD_URL|$NEW_URL|g" {} +
              echo "P4A System Recipes patched successfully!"
            fi


      # ============================================================
      # 5. BUILD APK (Single Run - No Retries)
      # ============================================================
      - run:
          name: Build GothicOCR APK (Direct Run)
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            
            # تعديل أي نسخة يتم استنساخها أثناء البناء مسبقاً
            find ~/.buildozer ~/project -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} + 2>/dev/null || true

            buildozer -v android debug


      # ============================================================
      # 6. VERIFY APK OUTPUT
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK Created Successfully: $APK"


      # ============================================================
      # 7. SAVE CLEAN CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-single-run-v1
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 8. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build-workflow:
    jobs:
      - build-apk
