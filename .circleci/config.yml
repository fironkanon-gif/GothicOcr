version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Check Android Environment
          command: |
            echo "=========================================="
            echo "Android Environment"
            echo "=========================================="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version
            python3 --version
            pip3 --version
            adb version || true

      - run:
          name: Install Python Build Dependencies
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install buildozer cython

      - run:
          name: Verify Project
          command: |
            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/__init__.py
            test -f utils/constants.py
            test -f screens/main_screen.py
            echo "Project structure OK"

      - run:
          name: Build APK
          command: |
            buildozer android debug

      - store_artifacts:
          path: bin
          destination: apk

workflows:
  build:
    jobs:
      - build-apk
