version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-global-cache-v1
            - gothicocr-buildozer-v8-{{ checksum "buildozer.spec" }}
            - gothicocr-p4a-v7-
            - gothicocr-v6-


      # ============================================================
      # 3. PREPARE ENVIRONMENT & INSTALL BUILD TOOLS
      # ============================================================
      - run:
          name: Prepare Environment & Install Buildozer
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 4. HARD FORCE OVERRIDE SAVANNAH URL (إلغاء نهائي ومسح القديم)
      # ============================================================
      - run:
          name: Hard Force Replace Savannah URLs Everywhere
          command: |
            set +e
            echo "=========================================="
            echo "PURGING OLD RECIPE CACHES & RE-ROUTING URLS"
            echo "=========================================="

            # 1. مسح أي ملفات recipe قديمة مخزنة في الكاش تحتوي على الرابط القديم
            rm -rf ~/.buildozer/android/platform/python-for-android 2>/dev/null || true
            rm -rf ~/project/.buildozer/android/platform/python-for-android 2>/dev/null || true

            # 2. إنشاء مجلد الـ Local Recipe المحلي وتأكيده
            mkdir -p ~/project/p4a_recipes/freetype
            cat << 'EOF' > ~/project/p4a_recipes/freetype/__init__.py
from pythonforandroid.recipe import Recipe

class FreeTypeRecipe(Recipe):
    version = '2.14.1'
    url = 'https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz'
    built_libraries = {'libfreetype.so': 'objs/.libs'}

recipe = FreeTypeRecipe()
EOF

            # 3. تعديل شامل لكل الملفات البرمجية داخل مكتبات Python والنظام لمنع Savannah نهائياً
            OLD_URL="https://download.savannah.gnu.org/releases/freetype/"
            NEW_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/"

            sudo grep -rnwl "$OLD_URL" /usr/ 2>/dev/null | xargs -r sudo sed -i "s|$OLD_URL|$NEW_URL|g" || true
            find ~ -type f \( -name "*.py" -o -name "*.pyc" \) -exec sed -i "s|$OLD_URL|$NEW_URL|g" {} + 2>/dev/null || true

            # 4. تنزيل حزمة FreeType مسبقاً وتوزيعها
            FT_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
            TMP_FILE="/tmp/freetype-2.14.1.tar.gz"
            curl -L "$FT_URL" -o "$TMP_FILE"

            PATHS=(
              "$HOME/.buildozer/cache/packages/freetype"
              "$HOME/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"
              "$HOME/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
              "$HOME/project/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"
              "$HOME/project/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
            )

            for DIR in "${PATHS[@]}"; do
              mkdir -p "$DIR"
              cp "$TMP_FILE" "$DIR/freetype-2.14.1.tar.gz" 2>/dev/null || true
              touch "$DIR/.mark-freetype-2.14.1.tar.gz" 2>/dev/null || true
            done

            echo "Force override complete!"


      # ============================================================
      # 5. BUILD APK WITH DYNAMIC HOT-PATCHING
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            set +e

            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "----------------------------------------"
              echo "Attempt $COUNT of $MAX_RETRIES..."
              echo "----------------------------------------"

              # التعديل الفوري والديناميكي مجدداً لكل ملف ينشئه buildozer في أوقات التجميع
              find ~/.buildozer ~/project -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} + 2>/dev/null || true

              buildozer -v android debug
              STATUS=$?

              if [ $STATUS -eq 0 ]; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi


      # ============================================================
      # 6. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK Created Successfully: $APK"


      # ============================================================
      # 7. SAVE GLOBAL CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-global-cache-v1
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 8. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build-workflow:
    jobs:
      - build-apk
