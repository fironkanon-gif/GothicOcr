version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-global-cache-v1
            - gothicocr-buildozer-v8-{{ checksum "buildozer.spec" }}
            - gothicocr-p4a-v7-
            - gothicocr-v6-


      # ============================================================
      # 3. BLOCK SAVANNAH GNU SITE PERMANENTLY
      # ============================================================
      - run:
          name: Block Broken GNU Domain & Setup Hosts
          command: |
            echo "Blocking savannah.gnu.org to force local cache usage..."
            echo "127.0.0.1 download.savannah.gnu.org" | sudo tee -a /etc/hosts
            echo "127.0.0.1 savannah.gnu.org" | sudo tee -a /etc/hosts


      # ============================================================
      # 4. PREPARE SYSTEM & INSTALL TOOLS
      # ============================================================
      - run:
          name: Prepare Environment & Install Buildozer
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 5. PRE-DOWNLOAD RECIPES & FREETYPE (WITH MARKERS)
      # ============================================================
      - run:
          name: Pre-download Dependencies & Create Markers
          command: |
            set +e
            echo "Pre-downloading FreeType from SourceForge Mirror..."

            P1="$HOME/.buildozer/cache/packages/freetype"
            P2="$HOME/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"
            P3="$HOME/project/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"

            mkdir -p "$P1" "$P2" "$P3"

            URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
            curl -L "$URL" -o "$P1/freetype-2.14.1.tar.gz" || true

            for DIR in "$P1" "$P2" "$P3"; do
              cp "$P1/freetype-2.14.1.tar.gz" "$DIR/" 2>/dev/null || true
              touch "$DIR/.mark-freetype-2.14.1.tar.gz" 2>/dev/null || true
            done


      # ============================================================
      # 6. BUILD APK WITH RETRY LOOP
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            set +e

            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "----------------------------------------"
              echo "Attempt $COUNT of $MAX_RETRIES..."
              echo "----------------------------------------"

              buildozer -v android debug
              STATUS=$?

              if [ $STATUS -eq 0 ]; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi


      # ============================================================
      # 7. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK created successfully: $APK"


      # ============================================================
      # 8. SAVE GLOBAL BUILD CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-global-cache-v1
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 9. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


# ============================================================
# WORKFLOWS (تشغيل الـ job بنجاح)
# ============================================================
workflows:
  build-workflow:
    jobs:
      - build-apk
