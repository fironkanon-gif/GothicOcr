version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Prepare Python Environment
          command: |
            set -e

            sudo apt-get update -qq
            sudo apt-get install -y python3-pip python3-venv

            python3 --version

            python3 -m venv "$HOME/gothicocr-venv"

            "$HOME/gothicocr-venv/bin/python" -m pip install --upgrade pip

            "$HOME/gothicocr-venv/bin/python" -m pip --version

      - run:
          name: Install Buildozer
          command: |
            set -e

            "$HOME/gothicocr-venv/bin/python" -m pip install \
              buildozer==1.6.0 \
              cython

            "$HOME/gothicocr-venv/bin/buildozer" --version
            "$HOME/gothicocr-venv/bin/cython" --version

      - run:
          name: Check Android Environment
          command: |
            set -e

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            java -version
            python3 --version

            test -d "$ANDROID_HOME"
            test -d "$ANDROID_SDK_ROOT"

            echo "Android environment OK"

      - run:
          name: Check GothicOCR Files
          command: |
            set -e

            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f services/model_service.py
            test -f services/image_service.py
            test -f screens/main_screen.py
            test -f utils/constants.py

            echo "All required GothicOCR files found"

      - run:
          name: Validate Python
          command: |
            set -e

            "$HOME/gothicocr-venv/bin/python" -m py_compile main.py
            "$HOME/gothicocr-venv/bin/python" -m py_compile services/model_service.py
            "$HOME/gothicocr-venv/bin/python" -m py_compile services/image_service.py
            "$HOME/gothicocr-venv/bin/python" -m py_compile screens/main_screen.py
            "$HOME/gothicocr-venv/bin/python" -m py_compile utils/constants.py

            echo "Python syntax OK"

      - run:
          name: Build GothicOCR APK
          command: |
            set -e

            # Make Buildozer and Cython from the venv visible to PATH
            export PATH="$HOME/gothicocr-venv/bin:$PATH"

            echo "Python: $(python3 --version)"
            echo "Buildozer: $(which buildozer)"
            echo "Cython: $(which cython)"

            buildozer --version
            cython --version

            buildozer -v android debug

      - store_artifacts:
          path: bin
          destination: apk

workflows:
  build:
    jobs:
      - build-apk
