# ============================================================
      # 12. BUILD APK
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            set +e

            echo "========================================"
            echo "GOTHICOCR APK BUILD"
            echo "========================================"

            # 1. إنشاء مجلد كاش الحزم الخارجي المباشر لـ python-for-android
            mkdir -p ~/.buildozer/cache/packages/freetype
            mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype

            # 2. تنزيل freetype من سيرفر SourceForge المستقر وتخزينه في المسارين المتوقعين
            echo "Downloading FreeType from stable mirror..."
            curl -L "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz" -o ~/.buildozer/cache/packages/freetype/freetype-2.14.1.tar.gz || true
            cp ~/.buildozer/cache/packages/freetype/freetype-2.14.1.tar.gz ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype/ 2>/dev/null || true

            # 3. حلقة التكرار التلقائية لتشغيل البناء
            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "----------------------------------------"
              echo "Attempt $COUNT of $MAX_RETRIES..."
              echo "----------------------------------------"

              buildozer -v android debug
              STATUS=$?

              if [ $STATUS -eq 0 ]; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi
