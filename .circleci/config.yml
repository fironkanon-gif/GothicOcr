version: 2.1

jobs:
  build-apk:

    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-freetype-v12-{{ checksum "buildozer.spec" }}
            - gothicocr-freetype-v12-


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install System Dependencies
          command: |
            set -eux

            echo "========================================"
            echo "INSTALLING SYSTEM DEPENDENCIES"
            echo "========================================"

            sudo apt-get update -qq

            sudo apt-get install -y \
              ant \
              python3-pip \
              python3-dev \
              python3-venv \
              build-essential \
              gcc \
              g++ \
              make \
              git \
              zip \
              unzip \
              wget \
              curl \
              patch \
              pkg-config \
              cmake \
              autoconf \
              automake \
              autopoint \
              libtool \
              libffi-dev \
              libssl-dev \
              zlib1g-dev \
              gettext \
              ccache

            echo ""
            echo "Python:"
            python3 --version

            echo ""
            echo "Pip:"
            python3 -m pip --version


      # ============================================================
      # 4. INSTALL BUILDOZER + PYTHON-FOR-ANDROID + CYTHON
      # ============================================================
      - run:
          name: Install Python Build Tools
          command: |
            set -eux

            echo "========================================"
            echo "INSTALLING BUILDOZER"
            echo "========================================"

            python3 -m pip install \
              --break-system-packages \
              --upgrade \
              pip \
              setuptools \
              wheel

            python3 -m pip install \
              --break-system-packages \
              buildozer==1.6.0 \
              cython

            echo ""
            echo "========================================"
            echo "VERIFYING BUILD TOOLS"
            echo "========================================"

            command -v buildozer

            buildozer --version

            command -v cython

            cython --version


      # ============================================================
      # 5. CONFIGURE CCACHE
      # ============================================================
      - run:
          name: Configure CCache
          command: |
            set -eux

            mkdir -p "$HOME/.cache/ccache"

            ccache \
              --set-config=cache_dir="$HOME/.cache/ccache"

            ccache \
              --set-config=max_size=2G

            echo "CCache configured"


      # ============================================================
      # 6. VERIFY PROJECT FILES
      # ============================================================
      - run:
          name: Verify GothicOCR Files
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING PROJECT"
            echo "========================================"

            test -f main.py

            test -f buildozer.spec

            test -f models/gothic_ocr.tflite

            test -f services/model_service.py

            test -f services/image_service.py

            test -f screens/main_screen.py

            test -f utils/constants.py

            echo ""
            echo "All required files found"


      # ============================================================
      # 7. VALIDATE PYTHON
      # ============================================================
      - run:
          name: Validate Python Syntax
          command: |
            set -eux

            python3 -m py_compile main.py

            python3 -m py_compile \
              services/model_service.py

            python3 -m py_compile \
              services/image_service.py

            python3 -m py_compile \
              screens/main_screen.py

            python3 -m py_compile \
              utils/constants.py

            echo "Python syntax OK"


      # ============================================================
      # 8. PATCH FREETYPE 2.14.1
      #
      # Replace Savannah with SourceForge.
      #
      # The version was confirmed from the build log:
      # freetype-2.14.1.tar.gz
      # ============================================================
      - run:
          name: Patch FreeType Savannah URL
          command: |
            set -eux

            echo "========================================"
            echo "PATCHING FREETYPE DOWNLOAD URL"
            echo "========================================"

            OLD_URL="https://download.savannah.gnu.org/releases/freetype/"

            NEW_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/"

            echo ""
            echo "Old source:"
            echo "$OLD_URL"

            echo ""
            echo "New source:"
            echo "$NEW_URL"

            echo ""
            echo "Locating python-for-android..."

            P4A_DIR=$(
              python3 -c \
              "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))"
            )

            echo ""
            echo "python-for-android directory:"
            echo "$P4A_DIR"

            test -d "$P4A_DIR"

            echo ""
            echo "Searching FreeType recipe..."

            find "$P4A_DIR" \
              -type f \
              -name "*.py" \
              -print0 \
              | xargs -0 grep -l \
              "download.savannah.gnu.org/releases/freetype" \
              || true

            echo ""
            echo "Replacing Savannah URLs..."

            find "$P4A_DIR" \
              -type f \
              -name "*.py" \
              -print0 \
              | xargs -0 \
              sed -i \
              "s|${OLD_URL}|${NEW_URL}|g"

            echo ""
            echo "========================================"
            echo "VERIFY PATCH"
            echo "========================================"

            echo ""
            echo "Remaining Savannah FreeType URLs:"

            if grep -R \
              "download.savannah.gnu.org/releases/freetype" \
              "$P4A_DIR"
            then

              echo ""
              echo "ERROR:"
              echo "Savannah URL still exists!"

              exit 1

            else

              echo "NONE FOUND"

            fi

            echo ""
            echo "SourceForge FreeType URLs:"

            grep -R \
              "downloads.sourceforge.net/project/freetype" \
              "$P4A_DIR" \
              || true

            echo ""
            echo "FreeType patch completed successfully"


      # ============================================================
      # 9. CLEAN ONLY FAILED FREETYPE DOWNLOAD CACHE
      #
      # Do NOT delete the whole Buildozer cache.
      # ============================================================
      - run:
          name: Remove Old FreeType Download Cache
          command: |
            set -eux

            echo "========================================"
            echo "CLEANING OLD FREETYPE CACHE ONLY"
            echo "========================================"

            find "$HOME/.buildozer" \
              -type f \
              \( \
                -name "freetype-2.14.1.tar.gz" \
                -o \
                -name ".mark-freetype-2.14.1.tar.gz" \
              \) \
              -delete \
              2>/dev/null \
              || true

            echo "Old FreeType cache cleaned"


      # ============================================================
      # 10. BUILD APK
      #
      # Patch generated python-for-android files again before
      # each retry, because Buildozer can create/copy new files.
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            set -e

            OLD_URL="https://download.savannah.gnu.org/releases/freetype/"

            NEW_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/"

            MAX_ATTEMPTS=3

            ATTEMPT=1

            SUCCESS=0

            echo "========================================"
            echo "GOTHICOCR APK BUILD"
            echo "========================================"

            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

              echo ""

              echo "========================================"
              echo "BUILD ATTEMPT $ATTEMPT OF $MAX_ATTEMPTS"
              echo "========================================"

              echo ""
              echo "Checking for generated Savannah URLs..."

              if [ -d "$HOME/.buildozer" ]; then

                find "$HOME/.buildozer" \
                  -type f \
                  -name "*.py" \
                  -exec \
                  sed -i \
                  "s|${OLD_URL}|${NEW_URL}|g" \
                  {} + \
                  2>/dev/null \
                  || true

              fi

              if [ -d "$HOME/project/.buildozer" ]; then

                find "$HOME/project/.buildozer" \
                  -type f \
                  -name "*.py" \
                  -exec \
                  sed -i \
                  "s|${OLD_URL}|${NEW_URL}|g" \
                  {} + \
                  2>/dev/null \
                  || true

              fi

              set +e

              buildozer -v android debug

              STATUS=$?

              set -e

              if [ "$STATUS" -eq 0 ]; then

                echo ""

                echo "========================================"
                echo "BUILD SUCCESSFUL"
                echo "========================================"

                SUCCESS=1

                break

              fi

              echo ""

              echo "Build attempt $ATTEMPT failed."

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then

                echo ""
                echo "Waiting 20 seconds before retry..."

                sleep 20

              fi

              ATTEMPT=$((ATTEMPT + 1))

            done

            if [ "$SUCCESS" -ne 1 ]; then

              echo ""

              echo "========================================"
              echo "BUILD FAILED"
              echo "========================================"

              exit 1

            fi


      # ============================================================
      # 11. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING APK"
            echo "========================================"

            test -d bin

            ls -lah bin

            APK=$(find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1)

            test -n "$APK"

            test -s "$APK"

            echo ""

            echo "========================================"
            echo "APK CREATED SUCCESSFULLY"
            echo "========================================"

            echo ""

            echo "APK PATH:"

            echo "$APK"

            echo ""

            ls -lh "$APK"


      # ============================================================
      # 12. SAVE CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-freetype-v12-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 13. STORE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build-workflow:
    jobs:
      - build-apk
