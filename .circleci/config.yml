version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================
      - checkout

      # ======================================================
      # 2. Restore Python / Buildozer cache
      # ======================================================
      - restore_cache:
          keys:
            - gothicocr-build-v1-{{ checksum "buildozer.spec" }}
            - gothicocr-build-v1-
            - gothicocr-python-v1

      # ======================================================
      # 3. Prepare Python Environment
      #
      # IMPORTANT:
      # --system-site-packages allows pip --user to work
      # inside this virtual environment.
      # ======================================================
      - run:
          name: Prepare Python Environment
          command: |
            set -e

            echo "========================================"
            echo "Preparing Python environment"
            echo "========================================"

            python3 --version

            if [ ! -d "$HOME/gothicocr-venv" ]; then
              echo "Creating GothicOCR virtual environment..."
              python3 -m venv --system-site-packages "$HOME/gothicocr-venv"
            else
              echo "Using cached GothicOCR virtual environment..."
            fi

            export PATH="$HOME/gothicocr-venv/bin:$PATH"

            python --version
            python -m pip --version

            echo "Python environment OK"

      # ======================================================
      # 4. Install / verify Buildozer + Cython
      # ======================================================
      - run:
          name: Prepare Buildozer and Cython
          command: |
            set -e

            export PATH="$HOME/gothicocr-venv/bin:$PATH"

            echo "========================================"
            echo "Checking Buildozer and Cython"
            echo "========================================"

            if ! command -v buildozer >/dev/null 2>&1; then
              echo "Buildozer not found - installing..."
              python -m pip install \
                buildozer==1.6.0 \
                cython
            else
              echo "Buildozer already available from cache."
            fi

            if ! command -v cython >/dev/null 2>&1; then
              echo "Cython not found - installing..."
              python -m pip install cython
            else
              echo "Cython already available from cache."
            fi

            echo "----------------------------------------"
            echo "Buildozer:"
            buildozer --version

            echo "Cython:"
            cython --version

            echo "----------------------------------------"
            echo "Build tools OK"

      # ======================================================
      # 5. Save Python / Buildozer cache
      # ======================================================
      - save_cache:
          key: gothicocr-python-v1
          paths:
            - ~/gothicocr-venv

      # ======================================================
      # 6. Android Environment Check
      # ======================================================
      - run:
          name: Check Android Environment
          command: |
            set -e

            echo "========================================"
            echo "Android Environment"
            echo "========================================"

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            java -version
            python3 --version

            test -d "$ANDROID_HOME"
            test -d "$ANDROID_SDK_ROOT"

            echo "Android environment OK"

      # ======================================================
      # 7. GothicOCR Files Check
      # ======================================================
      - run:
          name: Check GothicOCR Files
          command: |
            set -e

            echo "========================================"
            echo "Checking GothicOCR files"
            echo "========================================"

            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f services/model_service.py
            test -f services/image_service.py
            test -f screens/main_screen.py
            test -f utils/constants.py

            echo "All required GothicOCR files found"

      # ======================================================
      # 8. Python Syntax Check
      # ======================================================
      - run:
          name: Validate Python
          command: |
            set -e

            export PATH="$HOME/gothicocr-venv/bin:$PATH"

            python -m py_compile main.py
            python -m py_compile services/model_service.py
            python -m py_compile services/image_service.py
            python -m py_compile screens/main_screen.py
            python -m py_compile utils/constants.py

            echo "Python syntax OK"

      # ======================================================
      # 9. Build APK
      # ======================================================
      - run:
          name: Build GothicOCR APK
          command: |
            set -e

            export PATH="$HOME/gothicocr-venv/bin:$PATH"

            echo "========================================"
            echo "Build GothicOCR APK"
            echo "========================================"

            echo "Python:"
            python --version

            echo "Buildozer:"
            which buildozer
            buildozer --version

            echo "Cython:"
            which cython
            cython --version

            echo "Starting Buildozer..."
            buildozer -v android debug

      # ======================================================
      # 10. Save heavy Buildozer cache
      # ======================================================
      - save_cache:
          key: gothicocr-build-v1-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer
            - ~/project/.buildozer

      # ======================================================
      # 11. Store APK
      # ======================================================
      - store_artifacts:
          path: bin
          destination: apk

workflows:
  build:
    jobs:
      - build-apk
