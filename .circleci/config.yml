version: 2.1

jobs:
  build-apk:

    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-build-v1-{{ checksum "buildozer.spec" }}
            - gothicocr-build-v1-


      # ============================================================
      # 3. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check Build Environment
          command: |
            set -eux

            echo "========================================"
            echo "GOTHICOCR BUILD ENVIRONMENT"
            echo "========================================"

            echo "Python:"
            python3 --version

            echo "Java:"
            java -version

            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-NOT_SET}"

            echo "ANDROID_SDK_ROOT:"
            echo "${ANDROID_SDK_ROOT:-NOT_SET}"

            echo "========================================"


      # ============================================================
      # 4. INSTALL SYSTEM DEPENDENCIES
      # FIXES: No module named pip
      # ============================================================
      - run:
          name: Install System Dependencies
          command: |
            set -eux

            echo "========================================"
            echo "INSTALLING SYSTEM DEPENDENCIES"
            echo "========================================"

            sudo apt-get update -qq

            sudo apt-get install -y \
              python3-pip \
              python3-dev \
              python3-venv \
              git \
              zip \
              unzip \
              curl \
              wget \
              patch \
              pkg-config \
              build-essential \
              gcc \
              g++ \
              make \
              autoconf \
              automake \
              autopoint \
              libtool \
              cmake \
              ccache \
              libffi-dev \
              libssl-dev \
              zlib1g-dev \
              gettext

            echo ""
            echo "========================================"
            echo "VERIFY PYTHON AND PIP"
            echo "========================================"

            python3 --version

            python3 -m pip --version

            echo ""
            echo "System dependencies installed successfully"


      # ============================================================
      # 5. INSTALL BUILDOZER + CYTHON
      # ============================================================
      - run:
          name: Install Buildozer
          command: |
            set -eux

            echo "========================================"
            echo "INSTALLING PYTHON BUILD TOOLS"
            echo "========================================"

            python3 -m pip install \
              --break-system-packages \
              --upgrade \
              pip \
              setuptools \
              wheel

            python3 -m pip install \
              --break-system-packages \
              buildozer==1.6.0 \
              cython

            echo ""
            echo "========================================"
            echo "VERIFY BUILD TOOLS"
            echo "========================================"

            command -v buildozer
            buildozer --version

            command -v cython
            cython --version

            echo ""
            echo "Build tools ready"


      # ============================================================
      # 6. CONFIGURE CCACHE
      # ============================================================
      - run:
          name: Configure CCache
          command: |
            set -eux

            echo "========================================"
            echo "CONFIGURING CCACHE"
            echo "========================================"

            mkdir -p "$HOME/.cache/ccache"

            ccache --set-config=cache_dir="$HOME/.cache/ccache"

            ccache --set-config=max_size=2G

            ccache --version

            echo "CCache configured successfully"


      # ============================================================
      # 7. VERIFY ANDROID ENVIRONMENT
      # ============================================================
      - run:
          name: Verify Android Environment
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING ANDROID ENVIRONMENT"
            echo "========================================"

            test -n "${ANDROID_HOME:-}"

            test -d "$ANDROID_HOME"

            command -v java

            command -v javac

            java -version

            javac -version

            echo ""
            echo "ANDROID_HOME=$ANDROID_HOME"

            echo "Android environment OK"


      # ============================================================
      # 8. VERIFY PROJECT FILES
      # ============================================================
      - run:
          name: Verify GothicOCR Files
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING PROJECT FILES"
            echo "========================================"

            test -f main.py

            test -f buildozer.spec

            test -f models/gothic_ocr.tflite

            test -f services/model_service.py

            test -f services/image_service.py

            test -f screens/main_screen.py

            test -f utils/constants.py

            echo ""
            echo "All required GothicOCR files found"


      # ============================================================
      # 9. VERIFY TFLITE MODEL
      # ============================================================
      - run:
          name: Verify TFLite Model
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING TFLITE MODEL"
            echo "========================================"

            MODEL="models/gothic_ocr.tflite"

            test -s "$MODEL"

            echo "Model information:"

            ls -lh "$MODEL"

            SIZE=$(stat -c%s "$MODEL")

            echo "Model size: $SIZE bytes"

            test "$SIZE" -gt 0

            echo ""
            echo "TFLite model OK"


      # ============================================================
      # 10. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python Files
          command: |
            set -eux

            echo "========================================"
            echo "VALIDATING PYTHON SYNTAX"
            echo "========================================"

            python3 -m py_compile main.py

            python3 -m py_compile \
              services/model_service.py

            python3 -m py_compile \
              services/image_service.py

            python3 -m py_compile \
              screens/main_screen.py

            python3 -m py_compile \
              utils/constants.py

            echo ""
            echo "Python syntax OK"


      # ============================================================
      # 11. VALIDATE BUILDOZER CONFIG
      # ============================================================
      - run:
          name: Validate Buildozer Configuration
          command: |
            set -eux

            echo "========================================"
            echo "VALIDATING BUILDOZER CONFIG"
            echo "========================================"

            test -s buildozer.spec

            grep -E "^title[[:space:]]*=" \
              buildozer.spec

            grep -E "^package.name[[:space:]]*=" \
              buildozer.spec

            grep -E "^package.domain[[:space:]]*=" \
              buildozer.spec

            grep -E "^requirements[[:space:]]*=" \
              buildozer.spec

            echo ""
            echo "Buildozer configuration OK"


      # ============================================================
      # 12. BUILD APK
      #
      # Retry handles temporary Internet/download failures.
      # Cached downloads remain available between builds.
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            set -eux

            echo "========================================"
            echo "STARTING GOTHICOCR APK BUILD"
            echo "========================================"

            echo ""
            echo "Python:"
            python3 --version

            echo ""
            echo "Buildozer:"
            buildozer --version

            echo ""
            echo "Cython:"
            cython --version

            echo ""
            echo "Java:"
            java -version

            echo ""
            echo "========================================"

            MAX_ATTEMPTS=3
            ATTEMPT=1
            BUILD_SUCCESS=0

            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

              echo ""
              echo "========================================"
              echo "BUILD ATTEMPT $ATTEMPT OF $MAX_ATTEMPTS"
              echo "========================================"

              set +e

              buildozer -v android debug

              STATUS=$?

              set -e

              if [ "$STATUS" -eq 0 ]; then

                echo ""
                echo "========================================"
                echo "BUILD SUCCEEDED"
                echo "========================================"

                BUILD_SUCCESS=1

                break

              fi

              echo ""
              echo "Build attempt $ATTEMPT failed."

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then

                echo "Waiting 20 seconds before retry..."

                sleep 20

              fi

              ATTEMPT=$((ATTEMPT + 1))

            done

            if [ "$BUILD_SUCCESS" -ne 1 ]; then

              echo ""
              echo "========================================"
              echo "BUILD FAILED AFTER ALL ATTEMPTS"
              echo "========================================"

              exit 1

            fi


      # ============================================================
      # 13. VERIFY APK
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux

            echo "========================================"
            echo "VERIFYING APK"
            echo "========================================"

            test -d bin

            echo ""

            ls -lah bin

            echo ""

            APK_COUNT=$(find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l)

            echo "APK count: $APK_COUNT"

            test "$APK_COUNT" -ge 1

            APK=$(find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1)

            test -s "$APK"

            echo ""

            echo "========================================"
            echo "APK CREATED SUCCESSFULLY"
            echo "========================================"

            echo "APK: $APK"

            ls -lh "$APK"


      # ============================================================
      # 14. SAVE BUILD CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-build-v1-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 15. STORE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


      # ============================================================
      # 16. STORE BUILDOZER FILES
      # Runs even if directory exists after successful build
      # ============================================================
      - store_artifacts:
          path: .buildozer
          destination: buildozer


workflows:

  build-workflow:

    jobs:
      - build-apk
