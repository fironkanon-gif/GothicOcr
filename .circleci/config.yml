version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE EXISTING BUILD CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-incremental-cache-{{ checksum "buildozer.spec" }}
            - gothicocr-incremental-cache-
            - gothicocr-single-run-v1


      # ============================================================
      # 3. PREPARE ENVIRONMENT & REDIRECT SAVANNAH TRAFFIC
      # ============================================================
      - run:
          name: Prepare Environment & Block Savannah Domain
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            # تحويل أي طلب يتجه لـ Savannah إلى SourceForge مباشرة على مستوى النظام
            echo "104.18.32.7 download.savannah.gnu.org" | sudo tee -a /etc/hosts

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 4. PATCH ALL P4A RECIPES & SYSTEM FILES
      # ============================================================
      - run:
          name: Absolute Patch for FreeType Recipe
          command: |
            set +e
            echo "Applying absolute patch to replace Savannah URLs..."

            # تعديل أي ملف في pythonforandroid
            P4A_DIR=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null)
            if [ -d "$P4A_DIR" ]; then
              sudo find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} +
            fi

            # تعديل الكاش الموجود حالياً إن وجد
            find ~/.buildozer ~/project -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} + 2>/dev/null || true


      # ============================================================
      # 5. RESUME BUILD (استكمال البناء من مكان التوقف)
      # ============================================================
      - run:
          name: Resume GothicOCR Build
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1

            # إجبار التعديل مرة أخرى قبل تشغيل buildozer مباشرة
            find ~/.buildozer ~/project -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} + 2>/dev/null || true

            buildozer -v android debug


      # ============================================================
      # 6. VERIFY APK OUTPUT
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK Created Successfully: $APK"


      # ============================================================
      # 7. SAVE INCREMENTAL CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-incremental-cache-{{ checksum "buildozer.spec" }}
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 8. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build-workflow:
    jobs:
      - build-apk
