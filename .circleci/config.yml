version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1-ndk

    working_directory: ~/project

    environment:
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - checkout


      # ============================================================
      # 2. RESTORE CACHE
      # ============================================================
      - restore_cache:
          keys:
            - gothicocr-global-cache-v1
            - gothicocr-buildozer-v8-{{ checksum "buildozer.spec" }}
            - gothicocr-p4a-v7-
            - gothicocr-v6-


      # ============================================================
      # 3. PREPARE ENVIRONMENT & INSTALL BUILD TOOLS
      # ============================================================
      - run:
          name: Prepare Environment & Install Buildozer
          command: |
            set -eux
            sudo apt-get update -qq
            sudo apt-get install -y \
              ant python3-pip python3-dev python3-venv build-essential \
              gcc g++ make git zip unzip wget curl patch pkg-config \
              cmake autoconf automake autopoint libtool libffi-dev libssl-dev gettext ccache

            sudo python3 -m pip install --break-system-packages --ignore-installed --upgrade pip setuptools wheel
            sudo python3 -m pip install --break-system-packages buildozer==1.6.0 cython

            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=cache_dir="$HOME/.cache/ccache"
            ccache --set-config=max_size=2G


      # ============================================================
      # 4. PRE-DOWNLOAD & OVERRIDE FREETYPE PACKAGE
      # ============================================================
      - run:
          name: Pre-download FreeType & Set Local Recipe
          command: |
            set +e
            echo "Setting up local recipe and downloads..."

            # 1. مسح الكاش القديم المتضمن للرابط المعطوب
            rm -rf ~/.buildozer/android/platform/python-for-android 2>/dev/null || true
            rm -rf ~/project/.buildozer/android/platform/python-for-android 2>/dev/null || true

            # 2. إنشاء المجلد وملف الـ Recipe المحلي
            mkdir -p ~/project/p4a_recipes/freetype
            echo "from pythonforandroid.recipe import Recipe" > ~/project/p4a_recipes/freetype/__init__.py
            echo "class FreeTypeRecipe(Recipe):" >> ~/project/p4a_recipes/freetype/__init__.py
            echo "    version = '2.14.1'" >> ~/project/p4a_recipes/freetype/__init__.py
            echo "    url = 'https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz'" >> ~/project/p4a_recipes/freetype/__init__.py
            echo "    built_libraries = {'libfreetype.so': 'objs/.libs'}" >> ~/project/p4a_recipes/freetype/__init__.py
            echo "recipe = FreeTypeRecipe()" >> ~/project/p4a_recipes/freetype/__init__.py

            # 3. تنزيل الحزمة مسبقاً وتوزيعها
            FT_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
            TMP_FILE="/tmp/freetype-2.14.1.tar.gz"
            curl -L "$FT_URL" -o "$TMP_FILE"

            PATHS=(
              "$HOME/.buildozer/cache/packages/freetype"
              "$HOME/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"
              "$HOME/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
              "$HOME/project/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype"
            )

            for DIR in "${PATHS[@]}"; do
              mkdir -p "$DIR"
              cp "$TMP_FILE" "$DIR/freetype-2.14.1.tar.gz" 2>/dev/null || true
              touch "$DIR/.mark-freetype-2.14.1.tar.gz" 2>/dev/null || true
            done


      # ============================================================
      # 5. BUILD APK WITH AUTOMATIC RETRY & HOT-PATCH
      # ============================================================
      - run:
          name: Build GothicOCR APK
          command: |
            export PIP_BREAK_SYSTEM_PACKAGES=1
            set +e

            MAX_RETRIES=5
            COUNT=1
            SUCCESS=0

            while [ $COUNT -le $MAX_RETRIES ]; do
              echo "----------------------------------------"
              echo "Attempt $COUNT of $MAX_RETRIES..."
              echo "----------------------------------------"

              # تبديل أي رابط ينشأ ديناميكياً أثناء البناء
              find ~/.buildozer ~/project -type f -name "*.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/|g' {} + 2>/dev/null || true

              buildozer -v android debug
              STATUS=$?

              if [ $STATUS -eq 0 ]; then
                echo "Build succeeded on attempt $COUNT!"
                SUCCESS=1
                break
              else
                echo "Attempt $COUNT failed. Retrying in 10 seconds..."
                sleep 10
                COUNT=$((COUNT+1))
              fi
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Build failed after $MAX_RETRIES attempts."
              exit 1
            fi


      # ============================================================
      # 6. VERIFY APK OUTPUT
      # ============================================================
      - run:
          name: Verify APK Output
          command: |
            set -eux
            test -d bin
            APK=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -s "$APK"
            echo "APK Created Successfully: $APK"


      # ============================================================
      # 7. SAVE GLOBAL CACHE
      # ============================================================
      - save_cache:
          key: gothicocr-global-cache-v1
          paths:
            - ~/.buildozer
            - ~/project/.buildozer
            - ~/.gradle
            - ~/.cache/pip
            - ~/.cache/ccache


      # ============================================================
      # 8. STORE ARTIFACTS
      # ============================================================
      - store_artifacts:
          path: bin
          destination: apk


workflows:
  build-workflow:
    jobs:
      - build-apk
